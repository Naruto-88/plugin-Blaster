# Deploy to cPanel (Secrets verified)
name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Standalone
        run: |
          pnpm build:standalone
          # Copy public and static files into the standalone structure
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/

      - name: Prepare Files for Sync
        run: |
          mkdir ../SOURCE_PREP
          # Sync everything to PREP
          rsync -av ./apps/web/.next/standalone/ ../SOURCE_PREP/
          # Create a root bridge server.js if it doesn't exist
          echo "require('./apps/web/server.js');" > ../SOURCE_PREP/server.js
          # Also include the .htaccess and SQL schema
          cp .htaccess ../SOURCE_PREP/
          cp mysql-final.sql ../SOURCE_PREP/

      - name: Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: "ns-app/"
          local-dir: "../SOURCE_PREP/"
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
