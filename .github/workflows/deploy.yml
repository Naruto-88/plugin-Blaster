# Deploy to cPanel (Secrets verified)
name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Standalone
        run: |
          pnpm build:standalone
          # Copy public and static files into the standalone structure
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/

      - name: Prepare Files for Sync
        run: |
          mkdir SOURCE_PREP
          # Sync everything to PREP
          rsync -av ./apps/web/.next/standalone/ SOURCE_PREP/
          # Remove nested node_modules to prevent React version conflicts
          rm -rf SOURCE_PREP/apps/web/node_modules
          # No bridge needed, but we MUST copy the nested server.js to the root
          # so it can find the root node_modules
          cp SOURCE_PREP/apps/web/server.js SOURCE_PREP/server.js
          # Also ensure .htaccess is there (but DON'T overwrite standalone package.json)
          cp .htaccess SOURCE_PREP/

      - name: Create Deployment Archive
        run: |
          cd SOURCE_PREP
          zip -r ../deploy.zip .
          
      - name: Upload Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: "plugincheckernet"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy.zip"
          target: "/home/plugincheckernet/"

      - name: Extract Archive via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: "plugincheckernet"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /home/plugincheckernet/ns-app
            mkdir -p /home/plugincheckernet/ns-app
            unzip -o /home/plugincheckernet/deploy.zip -d /home/plugincheckernet/ns-app
            rm /home/plugincheckernet/deploy.zip
