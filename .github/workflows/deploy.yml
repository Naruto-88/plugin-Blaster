# Deploy to cPanel (Secrets verified)
name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Standalone
        run: |
          pnpm build:standalone
          # Copy public and static files into the standalone structure
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/

      - name: Prepare Files for Sync
        run: |
          mkdir SOURCE_PREP
          # Sync everything to PREP
          rsync -av ./apps/web/.next/standalone/ SOURCE_PREP/
          # Remove nested node_modules to prevent React version conflicts
          rm -rf SOURCE_PREP/apps/web/node_modules
          # Create a root bridge server.js with auto-cleanup for node_modules conflict
          cat <<EOF > SOURCE_PREP/server.js
          const path = require('path'); const fs = require('fs'); const cp = require('child_process');
          const target = path.join(__dirname, 'apps/web/node_modules');
          if (fs.existsSync(target)) { try { cp.execSync('rm -rf ' + target); } catch(e) {} }
          try { 
            process.chdir(path.join(__dirname, 'apps/web')); 
            require('./server.js'); 
          } catch (err) { 
            fs.writeFileSync(path.join(__dirname, 'debug_error.txt'), err.stack); 
          }
          EOF
          cp SOURCE_PREP/server.js SOURCE_PREP/app.js
          cp SOURCE_PREP/server.js SOURCE_PREP/index.js
          # Also include the .htaccess and package.json
          cp .htaccess SOURCE_PREP/
          cp package.json SOURCE_PREP/

      - name: Create Deployment Archive
        run: |
          cd SOURCE_PREP
          zip -r ../deploy.zip .
          
      - name: Upload Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: "plugincheckernet"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy.zip"
          target: "/home/plugincheckernet/"

      - name: Extract Archive via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: "plugincheckernet"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /home/plugincheckernet/ns-app
            mkdir -p /home/plugincheckernet/ns-app
            unzip -o /home/plugincheckernet/deploy.zip -d /home/plugincheckernet/ns-app
            rm /home/plugincheckernet/deploy.zip
