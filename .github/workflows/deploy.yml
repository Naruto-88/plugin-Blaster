# Deploy to cPanel (Secrets verified)
name: Deploy to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Standalone
        run: |
          pnpm build:standalone
          # Copy public and static files into the standalone structure
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/

      - name: Prepare Files for Sync
        run: |
          mkdir ../SOURCE_PREP
          # Sync everything to PREP
          rsync -av ./apps/web/.next/standalone/ ../SOURCE_PREP/
          # Create a root bridge server.js if it doesn't exist
          echo "require('./apps/web/server.js');" > ../SOURCE_PREP/server.js
          # Also include the .htaccess
          cp .htaccess ../SOURCE_PREP/

      - name: Sync Files to cPanel via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "../SOURCE_PREP/"
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_PORT: 21098
          TARGET: "/home/divihdst/ns-app"
          EXCLUDE: "/node_modules/, /.git/"
